name: Sync to Gitee
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git config --global user.name "andwinds"
          git config --global user.email "andwinds@example.com"
          # 修复 dubious ownership
          git config --global --add safe.directory '*'
          # 清理旧remote
          git remote remove gitee || true
          # https协议推送
          git remote add gitee https://andwinds:${{ secrets.GITEE_TOKEN }}@gitee.com/andwinds/feiniaoyun.git
          # 超时120秒，超时直接失败，不再无限转圈
          timeout 120 git push gitee main --force
