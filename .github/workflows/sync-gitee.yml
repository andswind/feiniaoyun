name: Mirror to Gitee
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror repo to Gitee
        uses: wearerequired/git-mirror-action@v1
        env:
          # 格式：https://用户名:令牌@gitee.com/用户名/仓库名.git
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_TOKEN }}
        with:
          source-repo: ${{ github.repositoryUrl }}
          destination-repo: https://andwinds:${{ secrets.GITEE_TOKEN }}@gitee.com/andwinds/feiniaoyun.git
