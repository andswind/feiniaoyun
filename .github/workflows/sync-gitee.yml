name: Push to Gitee mirror
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mirror-to-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repository to Gitee
        uses: wearerequired/git-mirror-action@master
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
        with:
          source-repo: git@github.com:andswind】/feiniaoyun.git
          destination-repo: git@gitee.com:andwinds/feiniaoyun.git
