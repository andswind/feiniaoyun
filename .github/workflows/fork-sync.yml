name: Sync upstream source
on:
  schedule:
    - cron: '0 */2 * * *' # UTC时间，每2小时检查一次上游，可改成 */30 * * * * 30分钟一次
  workflow_dispatch: # 网页可以手动点按钮触发同步

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync from upstream
        run: |
          git remote add upstream https://github.com/feiniaoyun/feiniaoyun.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
