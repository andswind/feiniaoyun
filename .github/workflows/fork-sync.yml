name: Sync upstream source
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        run: |
          git remote add upstream https://github.com/feiniaoyun/feiniaoyun.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
